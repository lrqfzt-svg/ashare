<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 A股市场复盘报告 · 历史归档</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0e11; color: #e1e8ed; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; line-height: 1.6; padding: 0; }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  .header { background: linear-gradient(135deg, #1a1e24 0%, #0d1117 100%); border: 1px solid #2d333b; border-radius: 12px; padding: 32px; margin-bottom: 24px; text-align: center; }
  .header h1 { font-size: 26px; color: #f85149; margin-bottom: 8px; }
  .header .date { color: #8b949e; font-size: 14px; }
  .card { background: #161b22; border: 1px solid #2d333b; border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: border-color .2s; }
  .card:hover { border-color: #f85149; }
  .card a { color: #e1e8ed; text-decoration: none; font-size: 15px; font-weight: 600; }
  .card .meta { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .tag { background: #21262d; border: 1px solid #2d333b; border-radius: 20px; padding: 3px 12px; font-size: 12px; color: #8b949e; }
  .up { color: #f85149; }
  .down { color: #3fb950; }
  .empty { color: #8b949e; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 A股市场复盘报告 · 历史归档</h1>
    <div class="date">晚睡协会 · A股市场复盘报告归档站</div>
  </div>
  <div id="list">加载中...</div>
</div>
<script>
fetch('archive.json').then(r => r.json()).then(list => {
  const el = document.getElementById('list');
  if (!list || !list.length) { el.innerHTML = '<div class="empty">暂无历史报告</div>'; return; }
  el.innerHTML = list.map(x => `
    <div class="card">
      <div>
        <a href="reports/${x.slug}.html">${x.title}</a>
        <div class="meta">上涨 <span class="up">${x.up}</span> · 下跌 <span class="down">${x.down}</span> · 成交 ${x.amount} · 涨停 ${x.zt}</div>
      </div>
      <span class="tag">${x.date}</span>
    </div>`).join('');
}).catch(e => { document.getElementById('list').innerHTML = '<div class="empty">归档加载失败</div>'; });
</script>
</body>
</html>
